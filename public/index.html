<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Tracking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="login-box">
      <h1>Document Tracking System</h1>
      <p class="muted">Log in to continue</p>
      <label>Username <input id="username" required autofocus></label>
      <label>Password <input id="password" type="password" required></label>
      <button type="submit">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app-view" hidden>
    <header>
      <h1>Document Tracking System</h1>
      <div class="who"><span id="who"></span><button id="logout" class="ghost">Log out</button></div>
    </header>
    <nav id="nav">
      <button data-page="dashboard">Dashboard</button>
      <button data-page="documents">Documents</button>
      <button data-page="register" data-roles="admin,clerk">Register document</button>
      <button data-page="overdue">Overdue</button>
      <button data-page="departments">Departments</button>
    </nav>

    <main>
      <section id="page-dashboard" hidden>
        <div id="kpis" class="kpis"></div>
        <div class="two-col">
          <div class="panel"><h2>Documents by status</h2><div id="chart-status"></div></div>
          <div class="panel"><h2>Documents by origin department</h2><div id="chart-dept"></div></div>
        </div>
      </section>

      <section id="page-documents" hidden>
        <div class="toolbar">
          <input id="search" placeholder="Search by number or title">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option>Registered</option><option>Routed</option><option>Received</option>
            <option>Returned</option><option>Approved</option><option>Rejected</option><option>Released</option>
          </select>
        </div>
        <table>
          <thead><tr><th>Number</th><th>Title</th><th>Type</th><th>Origin</th><th>Status</th><th>Registered</th></tr></thead>
          <tbody id="doc-rows"></tbody>
        </table>
      </section>

      <section id="page-register" hidden>
        <form id="register-form" class="panel form">
          <h2>Register a document</h2>
          <label>Title <input id="r-title" required></label>
          <label>Type <select id="r-type" required></select></label>
          <label>Origin department <select id="r-dept" required></select></label>
          <label>Description <textarea id="r-desc" rows="3"></textarea></label>
          <button type="submit">Register</button>
          <p class="muted">The document number is generated automatically.</p>
        </form>
      </section>

      <section id="page-overdue" hidden>
        <p id="overdue-note" class="muted"></p>
        <table>
          <thead><tr><th>Number</th><th>Title</th><th>Waiting at</th><th>Routed</th><th>Days waiting</th></tr></thead>
          <tbody id="overdue-rows"></tbody>
        </table>
      </section>

      <section id="page-departments" hidden>
        <form id="dept-form" class="toolbar" data-roles="admin">
          <input id="dept-name" placeholder="New department name" required>
          <button type="submit">Add department</button>
        </form>
        <table>
          <thead><tr><th>Department</th><th>Status</th><th></th></tr></thead>
          <tbody id="dept-rows"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- DOCUMENT PROFILE -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button id="modal-close" class="ghost close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
